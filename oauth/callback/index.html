<!doctype html>
<meta charset="utf-8">
<title>OAuth callback — dasiplus</title>
<style>
  body{font-family:system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem;color:#222}
  code{background:#f4f4f5;padding:.2rem .4rem;border-radius:4px;font-size:.95em}
  .box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;margin:1rem 0;word-break:break-all}
  button{padding:.5rem 1rem;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
  .ok{color:#15803d}
  .err{color:#b91c1c}
</style>
<h1>OAuth callback</h1>
<div id="out">Reading...</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const out = document.getElementById('out');
  if (error) {
    out.innerHTML = `<p class="err"><strong>Error:</strong> ${error}</p><p>${params.get('error_description')||''}</p>`;
  } else if (code) {
    out.innerHTML = `
      <p class="ok"><strong>Authorization code received.</strong></p>
      <div class="box"><code id="c">${code}</code></div>
      <button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copied'">Copy code</button>
      <p>State: <code>${state||''}</code></p>
      <p style="color:#666;font-size:.9em">Paste this code back into the setup script. The code is single-use and expires in ~5 minutes.</p>
    `;
  } else {
    out.textContent = 'No code in URL.';
  }
</script>
